playwright:
  headless: true
  timeout_ms: 20000
  wait_until: networkidle
llm:
  provider: deepseek
  model: deepseek-flash
  temperature: 0.0
  max_retries: 3
grading:
  confidence_threshold: 0.8
  max_score: 25
  xlsx_save_interval: 50            # 每 N 行 save 一次 xlsx（断点续跑间隔）
  concurrency: 4                    # 阶段C并发 worker 数；1=串行（等价旧行为）；建议 4-8
circuit_breaker:
  max_consecutive_fetch_failures: 10  # 连续抓取失败超过此数触发熔断
  max_consecutive_llm_failures: 5     # 连续 LLM 调用失败超过此数触发熔断
  action: prompt                       # prompt=询问用户 / skip=自动跳过 / abort=直接退出
output:
  detail_log: grading_detail.jsonl
  review_queue: review_queue.csv
  render_dumps_subdir: render_dumps
  render_dumps_on_failure_only: true
